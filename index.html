/* Base styles for the element that has a tooltip */

[hidden]{display:none!important}
.marker-cluster{border-radius:50%;background-clip:padding-box}

/* Layout: one-screen app. Map fills the screen; a panel (right on desktop, bottom sheet on phone) holds filters, nearby list and details. */
:root{
  /* Brand colours: change these to restyle the whole page. */
  --brand:#f2c744; --brand-2:#eaa94a; --brand-ink:#1c1b17; --brand-dark:#1c1b17; --hot:#e8412c; --halal:#1d7a4c;
  --bg:#fbf6ea; --surface:#ffffff; --ink:#1c1b17; --muted:#6b645a; --line:#ece4d2;
  --accent:var(--brand); --accent-ink:var(--brand-ink); --you:#2563eb; --land:#f6efe0; --land-line:#e2d5bd; --water:#d4e6ec; --other-land:#efe9dc;
  --s1:#d9480f; --s2:#c2255c; --s3:#1d7a4c; --s4:#1971c2; --s5:#7048e8; --s6:#b08900;
  --display:"Oswald", "Arial Narrow", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 6px 24px rgba(20,30,25,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141310; --surface:#1e1d19; --ink:#f4efe4; --muted:#ada594; --line:#34312a; --hot:#ff6a52; --halal:#4fbf86;
  --accent:var(--brand); --accent-ink:var(--brand-ink); --you:#60a5fa; --land:#241e18; --land-line:#3a3027; --water:#101a1e; --other-land:#1d1915;
  --s1:#ff8a4c; --s2:#f06595; --s3:#4fbf86; --s4:#5aa9f0; --s5:#9f87ff; --s6:#e0b93a;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141310; --surface:#1e1d19; --ink:#f4efe4; --muted:#ada594; --line:#34312a; --hot:#ff6a52; --halal:#4fbf86;
  --accent:var(--brand); --accent-ink:var(--brand-ink); --you:#60a5fa; --land:#241e18; --land-line:#3a3027; --water:#101a1e; --other-land:#1d1915;
  --s1:#ff8a4c; --s2:#f06595; --s3:#4fbf86; --s4:#5aa9f0; --s5:#9f87ff; --s6:#e0b93a;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 380px}
#map{height:100%;width:100%;background:var(--water)}
.leaflet-container{font-family:var(--body);background:var(--water)}
#map{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hold-ring{position:absolute;z-index:800;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid var(--brand);background:color-mix(in srgb,var(--brand) 25%,transparent);pointer-events:none;opacity:0;animation:hold .45s .15s linear forwards}
@keyframes hold{from{transform:scale(.25);opacity:.2}to{transform:scale(1);opacity:1}}
.basectl{position:relative;border:0!important;box-shadow:0 1px 5px rgba(0,0,0,.35)!important}
.basebtn{width:34px;height:34px;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:0;border-radius:4px;cursor:pointer}
.basemenu{position:absolute;right:calc(100% + 8px);top:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;width:max-content;max-width:calc(100vw - 80px)}
.basemenu[hidden]{display:none}
.basemenu button{text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.basemenu button:hover{background:var(--bg)}
.basemenu button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.leaflet-tile-pane{opacity:1}
.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px;max-width:100%}
.locbar{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.locmsg{font-size:12px;color:var(--muted);line-height:1.45}
.locmsg b{color:var(--ink)}
.radius{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.list{overflow:auto;flex:1;min-height:0}
.listhead{position:sticky;top:0;background:var(--surface);padding:8px 16px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover,.item.on{background:var(--bg)}

.item .nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .sub{color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.item .dist{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);margin-left:4px;vertical-align:1px}
.tag.halal{border-color:var(--halal);color:var(--halal)}
.detail{position:absolute;z-index:1000;top:12px;left:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.detail h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.15;text-wrap:balance;padding-right:30px}
.detail .close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.ep{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:13px;line-height:1.45}
.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:12.5px;font-weight:600;text-decoration:none;padding:7px 10px;border-radius:9px;border:1px solid var(--line);color:var(--ink)}
.links a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:11.5px;color:var(--muted)}
/* food icon badge: emoji (or the logo) in a circle ringed with the season colour */
.fi{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ring,var(--brand));display:grid;place-items:center;font-size:17px;line-height:1;overflow:hidden;flex:none}
.fi{position:relative}
.fi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mk{position:relative;width:34px;height:42px;transform-origin:50% 100%;transition:transform .15s}
.mk .fi{width:34px;height:34px;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mk:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ring)}
.mk.sel{transform:scale(1.3);z-index:1}
.mk.sel .fi{box-shadow:0 0 0 3px var(--brand),0 3px 10px rgba(0,0,0,.35)}
.mk.stack{isolation:isolate;cursor:pointer}
.mk .fi.back{position:absolute;top:-4px;left:7px;z-index:-1;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mk.sel .fi.back{box-shadow:none}
.mk .cnt{position:absolute;top:-8px;right:-10px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--brand-dark);color:var(--brand);font:800 11px/20px var(--body);text-align:center;box-shadow:0 0 0 2px var(--surface)}
.stacklist{display:flex;flex-direction:column;margin:0 -16px -16px;border-top:1px solid var(--line)}
.stacklist .item:last-child{border-bottom:0}
.detail .back{align-self:flex-start;border:0;background:var(--bg);color:var(--ink);font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer;margin:-4px 0 -4px}
.you{width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--you) 30%,transparent)}

.leaflet-tooltip{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:6px 9px;font-size:12px}

.empty{padding:20px 16px;color:var(--muted);font-size:13px;line-height:1.5}
.delivery{padding:10px 16px 16px;font-size:12px;color:var(--muted);line-height:1.5}
.delivery summary{cursor:pointer;color:var(--ink);font-weight:600}

  state.stack=here.length>1?here:null;
  const gq=encodeURIComponent(r.name+" "+r.address),yt=ytId(r.video);
  const gimg="https://www.google.com/search?udm=2&q="+encodeURIComponent(r.name+" "+(r.country||shortAddr(r.address)||"Singapore")+" food");
  const dist=state.me&&r.lat!=null?`<dt>Distance</dt><dd>${fmtD(km(state.me,r))}${walk(km(state.me,r))} from ${esc(state.meLabel)}</dd>`:"";
  d.innerHTML=`<button class="close" type="button" aria-label="Close details">×</button>
    ${state.stack?`<button class="back" type="button">← ${state.stack.length} spots here</button>`:""}
    <div class="ep"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(${SVAR[r.season]})"></span>${esc(r.season)}${r.episode?" · "+esc(r.episode):""}</div>
    <h2>${esc(r.name)}</h2>
    <div class="dishline">${icon(r)}${r.dish.e?esc(r.dish.label):esc(r.cat)}</div>
    <div class="photos">${yt?`<a class="ph" href="${esc(r.video)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="Episode thumbnail" loading="lazy" onerror="this.parentNode.remove()"><span class="play" aria-hidden="true">▶</span><span class="cap">Watch the episode</span></a>`:""}${r.dish.wiki?`<figure class="ph" id="dishph" hidden><img alt="${esc(r.dish.label)}"><figcaption class="cap"></figcaption></figure>`:""}</div>
    <dl class="kv">
      <dt>Cuisine</dt><dd>${esc(r.cat)}</dd>
      <dt>Halal</dt><dd>${r.isHalal?(/OWNED/.test(r.halal)?"Muslim-owned":/FRIENDLY/.test(r.halal)?"Muslim-friendly":"Yes"):"No"}</dd>
      <dt>Address</dt><dd>${esc(r.address)}</dd>
      <dt>Hours</dt><dd>${esc(r.hours||"Not listed")}</dd>
      ${r.promo?`<dt>Promo</dt><dd><b>${esc(r.promo)}</b></dd>`:""}
      ${r.country?`<dt>Trip</dt><dd>${esc(r.country)}</dd>`:""}
      ${dist}
    </dl>
    <div class="links">
      ${r.lat!=null?`<a class="primary" href="https://www.google.com/maps/dir/?api=1&destination=${gq}" target="_blank" rel="noopener">Directions</a>`:""}
      <a href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">Google Maps</a>
      <a href="${gimg}" target="_blank" rel="noopener">Food photos (Google)</a>
      ${r.video?`<a href="${esc(r.video)}" target="_blank" rel="noopener">Watch episode</a>`:""}
      ${/^https?:/.test(r.ig)?`<a href="${esc(r.ig)}" target="_blank" rel="noopener">Instagram</a>`:""}
    </div>
    ${r.geo==="approx"?`<div class="note">Pin placed from the area or nearest postal code, so it may be off by a block or two.</div>`:""}`;
  if(r.dish.wiki)wikiImg(r.dish.wiki).then(x=>{const f=document.getElementById("dishph");
    if(!x||!f||state.sel!==id)return;const im=f.querySelector("img");im.onerror=()=>f.remove();im.src=x.src;
    f.querySelector("figcaption").innerHTML=`What ${esc(r.dish.label.toLowerCase())} looks like · <a href="${esc(x.url)}" target="_blank" rel="noopener">Wikipedia</a>`;f.hidden=false});
  d.hidden=false;d.scrollTop=0;d.querySelector(".close").onclick=closeDetail;
  const back=d.querySelector(".back");if(back)back.onclick=()=>openStack(state.stack);
  render();
  const m=markers.get(id);
  // Spots that share a place can't be pulled apart by zooming, so just fly to the shared pin.
  if(m&&fly){if(state.stack)map.flyTo(m.getLatLng(),Math.max(map.getZoom(),17),{duration:.6});
    else cluster.zoomToShowLayer(m,()=>{map.panTo(m.getLatLng());m.openTooltip()});}
  const li=document.querySelector(`.item[data-id="${id}"]`);li&&li.scrollIntoView({block:"nearest"});
}
render();
</script>
</body></html>
